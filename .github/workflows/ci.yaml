name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adguard_log_viewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests tools
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -q
      - name: Every dependency installs from a wheel on both architectures
        run: python tools/check_wheels.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: npm run build
      - name: The committed build is up to date
        # app/static is committed so the Supervisor never has to run Node on the
        # Home Assistant device. This fails if someone forgot to rebuild.
        run: |
          if [ -n "$(git status --porcelain ../adguard_log_viewer/app/static)" ]; then
            echo "::error::adguard_log_viewer/app/static is stale — run 'npm run build' and commit the result."
            git --no-pager diff --stat ../adguard_log_viewer/app/static
            exit 1
          fi

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: adguard_log_viewer
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.13-alpine3.21
            BUILD_ARCH=${{ matrix.arch }}
