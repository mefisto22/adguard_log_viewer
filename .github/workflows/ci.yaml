name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adguard_log_viewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests tools
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -q
      - name: Every dependency installs from a wheel on both architectures
        run: python tools/check_wheels.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
      - name: The committed build is up to date
        # app/static is committed so the Supervisor never has to run Node on the
        # Home Assistant device. This fails if someone forgot to rebuild.
        run: |
          if [ -n "$(git status --porcelain ../adguard_log_viewer/app/static)" ]; then
            echo "::error::adguard_log_viewer/app/static is stale — run 'npm run build' and commit the result."
            git --no-pager diff --stat ../adguard_log_viewer/app/static
            exit 1
          fi

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: adguard_log_viewer
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          push: false
          load: true
          tags: adguard-log-viewer:ci-${{ matrix.arch }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.13-alpine3.21
            BUILD_ARCH=${{ matrix.arch }}

      # The build only proves the image assembles. Starting it proves the
      # committed repository actually produces a working app — which a
      # .gitignore rule silently excluding app/categorization/data once broke,
      # with every local check still green.
      - name: Start the container and check it serves
        run: |
          set -euo pipefail
          mkdir -p /tmp/addon-data
          echo '{"log_level":"info","ingest_enabled":false}' > /tmp/addon-data/options.json
          docker run -d --name addon \
            --platform ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }} \
            -p 8099:8099 -v /tmp/addon-data:/data \
            adguard-log-viewer:ci-${{ matrix.arch }}

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8099/api/health

          echo "--- the built-in rule set is in the image ---"
          docker exec addon python -c 'from app.categorization.engine import load_builtin_ruleset as L; r = L(); assert len(r.rules) > 50, f"only {len(r.rules)} built-in rules in the image"; assert r.tags, "no built-in tags in the image"; print(f"{len(r.rules)} rules, {len(r.tags)} tags")'

          echo "--- the frontend is served ---"
          curl -fsS http://127.0.0.1:8099/ | grep -q '<div id="root">'

          echo "--- no errors in the log ---"
          docker logs addon 2>&1 | tail -30
          ! docker logs addon 2>&1 | grep -qE "Traceback|CRITICAL"

      - name: Container logs on failure
        if: failure()
        run: docker logs addon 2>&1 || true
