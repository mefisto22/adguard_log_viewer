---
configuration:
  adguard_url:
    name: AdGuard Home URL
    description: >-
      Az a cím, amin az AdGuard Home-ot megnyitod. Üresen hagyva az alkalmazás a
      Supervisortól kérdezi meg — ez akkor működik, ha az AdGuard Home alkalmazás
      publikál hoszt portot a webfelületéhez (80/tcp). Ha nem publikál, vagy az
      AdGuard máshol fut, írd ide a címet; ez teljesen normális beállítás, nem
      kerülőmegoldás. Egy önmagában megadott port (pl. 9000) is elég, az a
      Home Assistant hoszt adott portját jelenti. A Settings oldalon látszik,
      mit talált pontosan a felderítés.
  adguard_username:
    name: Felhasználónév
    description: >-
      Egy Home Assistant felhasználó neve. Az AdGuard Home alkalmazás a webes portot
      Home Assistant bejelentkezéssel védi, tehát ide HA belépési adat kell —
      nem az AdGuard sajátja, hacsak ott nem kapcsoltad be a
      "leave_front_door_open" opciót.
  adguard_password:
    name: Jelszó
    description: A fenti felhasználó jelszava. A Home Assistant tárolja, logba sosem kerül.
  adguard_verify_ssl:
    name: TLS tanúsítvány ellenőrzése
    description: >-
      Csak akkor kapcsold be, ha az AdGuard HTTPS-en érhető el érvényes
      tanúsítvánnyal. Helyi hálózaton általában sima HTTP van.
  adguard_slug:
    name: AdGuard alkalmazásazonosító
    description: >-
      Csak akkor kell, ha az automatikus felderítés rossz alkalmazást találna,
      például a0d7b954_adguard.
  provider:
    name: Query log forrás
    description: >-
      auto: a beállítás szerint; api: az AdGuard HTTP API-ja (Home Assistant OS
      alatt egyedül ez működik); file: a querylog.json közvetlen olvasása.
  querylog_path:
    name: Query log fájl
    description: >-
      Csak a file forráshoz. Home Assistant OS alatt egy alkalmazás nem tudja olvasni
      egy másik alkalmazás adatkönyvtárát, ott hagyd üresen.
  poll_interval:
    name: Lekérdezési időköz (másodperc)
    description: Milyen gyakran kérje le az új DNS kéréseket az AdGuard Home-ból.
  ingest_batch_size:
    name: Rekordok kérésenként
    description: Hány query log rekordot kérjen le egy API hívásban.
  max_pages_per_poll:
    name: Oldalak lekérdezésenként
    description: >-
      Felső korlát arra, mennyit dolgozhat egy lekérdezés. Az ennél régebbi
      rekordokat a következő körök hozzák be.
  ingest_enabled:
    name: Új kérések importálása
    description: Kikapcsolva az importálás leáll, de az alkalmazás tovább fut.
  retention_days:
    name: Előzmények megőrzése (nap)
    description: A régebbi kérések automatikusan törlődnek. A 0 korlátlan.
  log_level:
    name: Naplózási szint
    description: >-
      Az alkalmazás debug szint felett soha nem írja ki a lekérdezett domaineket a
      saját logjába.
network:
  8099/tcp: >-
    Közvetlen webes elérés. Nem szükséges: az alkalmazás a Home Assistant
    oldalsávjából nyílik. Az itt publikált portot NEM védi a HA bejelentkezés.
